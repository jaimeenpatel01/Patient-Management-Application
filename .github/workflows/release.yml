name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Build APK with EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          eas build:list \
            --platform android \
            --limit 1 \
            --json > build.json

          APK_URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build.json'));
            console.log(data[0].artifacts.buildUrl);
          ")

          curl -L "$APK_URL" -o physio-doctor.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: physio-doctor.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}